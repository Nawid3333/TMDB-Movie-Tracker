[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmdb-movie-tracker"
version = "1.0.0"
description = "Terminal-based TMDB list tracker with local enrichment, franchise gaps, and change detection."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0", "python-dotenv>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "respx>=0.22.0", "ruff>=0.6.0"]

[project.scripts]
movie-tracker = "main:_run_cli"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "src*", "src.ui*"]

# ==================== TESTS ====================
# Run the suite with:      python -m pytest
# With coverage:           python -m pytest --cov
# Timing benchmarks:       python -m pytest --benchmark
# Re-record the baseline:  python -m pytest --benchmark -m benchmark --benchmark-update
#
# Benchmarks are excluded from a normal run by tests/conftest.py, so `pytest`
# stays fast; see tests/bench.py for how a regression is judged.
[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet, but with the short traceback style that actually fits on a screen.
addopts = "-q --tb=short"
markers = [
    "benchmark: a timing test, skipped unless --benchmark is passed",
]

[tool.coverage.run]
source = ["main", "src", "config"]
branch = true
# Helper scripts that talk to the live site on purpose. They are tools, not
# code under test, and including them makes the coverage number meaningless.
omit = [
    "tests/*",
    "*/capture_fixtures.py",
    "*/probe_*.py",
    "*/manual_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
]
